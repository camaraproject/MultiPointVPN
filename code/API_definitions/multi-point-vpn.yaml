openapi: 3.0.3
info:
  title: MultiPoint Virtual Private Network
  description: |
    The MultiPoint VPN API lets an enterprise API consumer order and manage an
    on-demand, private multi-point network (an L3 IP-VPN mesh, RFC 4364 / BGP-MPLS
    style) that interconnects several enterprise touchpoints — sites, data centers
    and clouds — with a guaranteed bandwidth and quality profile.

    ## Resource model

    - A **Network** is the VPN service instance ordered by the consumer. It is
      identified by a `networkId` (UUID) returned when the network is created.
    - A **Network** is made up of one or more **Connections**. Each **Connection**
      is an attachment between a **customer edge** endpoint (the enterprise premises,
      `type: site`) and a **provider edge** endpoint (the operator/cloud on-ramp,
      `type: cloud` or `type: site`). A Connection is identified by a `connectionId`
      (UUID).
    - Connections can be **added** to or **removed** from an existing Network
      through dedicated sub-resource operations, without recreating the Network.

    ## Typical flow

    1. `POST /feasibility-check` — check whether the requested topology, bandwidth
       and service period can be delivered, and in what lead time (a non-committal
       feasibility qualification, no resource is created).
    2. `POST /networks` — order the multi-point VPN. The created Network is returned
       in the response body, and its location in the `Location` header.
    3. `GET /networks/{networkId}` — retrieve the current state of the service.
    4. `PATCH /networks/{networkId}` — modify service-level attributes
       (e.g. bandwidth, quality profile).
    5. `POST /networks/{networkId}/connections` and
       `DELETE /networks/{networkId}/connections/{connectionId}` — evolve the topology.
    6. `DELETE /networks/{networkId}` — cease the service (processed asynchronously).

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how a
    client requests an access token. Which specific authorization flows are to be
    used will be determined during onboarding process, happening between the API
    Client and the Telco Operator exposing the API, taking into account the
    declared purpose for accessing the API, while also being subject to the
    prevailing legal framework dictated by local legislation.

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore
    the API specification MAY not document some non-mandatory error statuses as
    indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated
    to this API version for a complete list of error responses. The applicable
    Commonalities Release can be identified in the `API Readiness Checklist`
    document associated to this API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error
    response if it is explicitly documented in the API.

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not
    declared in this specification, at any nesting level. Unknown properties result
    in a `400 INVALID_ARGUMENT` response.
  version: 0.1.0-alpha.1
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
  x-camara-commonalities: 0.8.0
externalDocs:
  description: Product documentation at CAMARA
  url: 'https://github.com/camaraproject/MultiPointVPN'
servers:
  - url: '{apiRoot}/multi-point-vpn/v0.1alpha1'
    variables:
      apiRoot:
        default: 'http://localhost:9091'
        description: API root, defined by the service provider, e.g. `api.example.com`
security:
  - openId: []
tags:
  - name: Feasibility
    description: Non-committal feasibility qualification for a MultiPoint VPN
  - name: Networks
    description: Order and manage MultiPoint VPN networks
  - name: Connections
    description: Manage the connections that make up a MultiPoint VPN network
paths:
  /feasibility-check:
    post:
      tags:
        - Feasibility
      summary: Check the feasibility of a MultiPoint VPN
      description: >
        Returns a non-committal feasibility qualification for the requested
        MultiPoint VPN topology, bandwidth and service period. No resource is
        created by this operation.
      operationId: checkFeasibility
      security:
        - openId:
            - multi-point-vpn:feasibility-check
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeasibilityRequest"
            examples:
              MULTI_POINT_VPN_FEASIBILITY:
                $ref: "#/components/examples/multiPointVpnFeasibilityRequest"
      responses:
        "200":
          description: Feasibility qualification result
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeasibilityResult"
              examples:
                MULTI_POINT_VPN_FEASIBILITY_RESULT:
                  $ref: "#/components/examples/multiPointVpnFeasibilityResponse"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "500":
          $ref: "#/components/responses/Generic500"
  /networks:
    post:
      tags:
        - Networks
      summary: Order a MultiPoint VPN network
      description: Create (order) a MultiPoint VPN network.
      operationId: createNetwork
      security:
        - openId:
            - multi-point-vpn:networks:create
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreate"
            examples:
              MULTI_POINT_VPN_CREATE:
                $ref: "#/components/examples/multiPointVpnCreateRequest"
      responses:
        "201":
          description: The MultiPoint VPN network has been created.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
            Location:
              description: URL of the newly created network resource.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
                example: "https://api.example.com/multi-point-vpn/v0.1alpha1/networks/8a2b1c9e-1f4d-4c8a-9b2a-3e5f7a1b2c3d"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
              examples:
                MULTI_POINT_VPN_CREATE_RESPONSE:
                  $ref: "#/components/examples/multiPointVpnResponse"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "409":
          $ref: "#/components/responses/Generic409"
        "422":
          $ref: "#/components/responses/Generic422"
        "500":
          $ref: "#/components/responses/Generic500"
  /networks/{networkId}:
    parameters:
      - $ref: "#/components/parameters/x-correlator"
      - $ref: "#/components/parameters/networkId"
    get:
      tags:
        - Networks
      summary: Retrieve a MultiPoint VPN network
      description: Retrieve the details and current state of a MultiPoint VPN network.
      operationId: getNetwork
      security:
        - openId:
            - multi-point-vpn:networks:read
      responses:
        "200":
          description: MultiPoint VPN network details
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
              examples:
                MULTI_POINT_VPN_GET_RESPONSE:
                  $ref: "#/components/examples/multiPointVpnResponse"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "500":
          $ref: "#/components/responses/Generic500"
    patch:
      tags:
        - Networks
      summary: Modify a MultiPoint VPN network
      description: Modify service-level attributes of a MultiPoint VPN network.
      operationId: updateNetwork
      security:
        - openId:
            - multi-point-vpn:networks:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkUpdate"
            examples:
              MULTI_POINT_VPN_UPDATE:
                $ref: "#/components/examples/multiPointVpnUpdateRequest"
      responses:
        "200":
          description: The MultiPoint VPN network has been updated.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
              examples:
                MULTI_POINT_VPN_UPDATE_RESPONSE:
                  $ref: "#/components/examples/multiPointVpnResponse"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "422":
          $ref: "#/components/responses/Generic422"
        "500":
          $ref: "#/components/responses/Generic500"
    delete:
      tags:
        - Networks
      summary: Cease a MultiPoint VPN network
      description: >
        Cease (delete) a MultiPoint VPN network. The request is accepted and
        processed asynchronously; the network transitions to `TERMINATING` and is
        removed once teardown completes.
      operationId: deleteNetwork
      security:
        - openId:
            - multi-point-vpn:networks:delete
      responses:
        "202":
          description: The cease request has been accepted for processing.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "500":
          $ref: "#/components/responses/Generic500"
  /networks/{networkId}/connections:
    parameters:
      - $ref: "#/components/parameters/x-correlator"
      - $ref: "#/components/parameters/networkId"
    get:
      tags:
        - Connections
      summary: List the connections of a MultiPoint VPN network
      description: Retrieve the list of connections that make up a MultiPoint VPN network.
      operationId: listConnections
      security:
        - openId:
            - multi-point-vpn:networks:read
      responses:
        "200":
          description: The list of connections of the network.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "500":
          $ref: "#/components/responses/Generic500"
    post:
      tags:
        - Connections
      summary: Add a connection to a MultiPoint VPN network
      description: Add a new connection to an existing MultiPoint VPN network.
      operationId: addConnection
      security:
        - openId:
            - multi-point-vpn:networks:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreate"
            examples:
              ADD_CONNECTION:
                $ref: "#/components/examples/addConnectionRequest"
      responses:
        "201":
          description: The connection has been added to the network.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
            Location:
              description: URL of the newly created connection resource.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
              examples:
                ADD_CONNECTION_RESPONSE:
                  $ref: "#/components/examples/connectionResponse"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "422":
          $ref: "#/components/responses/Generic422"
        "500":
          $ref: "#/components/responses/Generic500"
  /networks/{networkId}/connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/x-correlator"
      - $ref: "#/components/parameters/networkId"
      - $ref: "#/components/parameters/connectionId"
    delete:
      tags:
        - Connections
      summary: Remove a connection from a MultiPoint VPN network
      description: >
        Remove a connection from a MultiPoint VPN network. The request is accepted
        and the teardown of the connection is processed asynchronously.
      operationId: removeConnection
      security:
        - openId:
            - multi-point-vpn:networks:update
      responses:
        "202":
          description: The connection removal request has been accepted for processing.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "500":
          $ref: "#/components/responses/Generic500"
components:
  securitySchemes:
    openId:
      type: openIdConnect
      description: OpenID Connect authentication, per the CAMARA Security and Interoperability Profile.
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
  headers:
    x-correlator:
      description: Correlation id for the different services.
      schema:
        $ref: "#/components/schemas/XCorrelator"
  parameters:
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services.
      required: false
      schema:
        $ref: "#/components/schemas/XCorrelator"
    networkId:
      name: networkId
      in: path
      required: true
      description: The UUID of the MultiPoint VPN network resource.
      schema:
        $ref: "#/components/schemas/Uuid"
    connectionId:
      name: connectionId
      in: path
      required: true
      description: The UUID of the connection resource.
      schema:
        $ref: "#/components/schemas/Uuid"
  schemas:
    Uuid:
      type: string
      format: uuid
      maxLength: 36
      description: A UUID (RFC 4122) uniquely identifying a resource.
    XCorrelator:
      type: string
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      description: Service correlator to make E2E observability. It is RECOMMENDED to use a UUID format.
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    Bandwidth:
      type: object
      description: A bandwidth quantity, expressed as a value and a unit.
      required:
        - value
        - unit
      properties:
        value:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The bandwidth value in the given unit.
        unit:
          type: string
          description: The unit of the bandwidth value.
          enum:
            - Mbps
            - Gbps
    TimePeriod:
      type: object
      description: A time period with a start and an optional end.
      required:
        - startDate
      properties:
        startDate:
          type: string
          format: date-time
          maxLength: 30
          description: >
            The start date and time of the service period. It must follow
            [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            and must have time zone.
          example: "2026-08-01T00:00:00Z"
        endDate:
          type: string
          format: date-time
          maxLength: 30
          description: >
            The end date and time of the service period. When omitted, the service
            period is open-ended until explicitly ceased. It must follow
            [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            and must have time zone.
          example: "2027-08-01T00:00:00Z"
    Ipv4Address:
      type: object
      description: An IPv4 address.
      required:
        - addressType
        - address
      properties:
        addressType:
          type: string
          description: The address type discriminator.
          enum:
            - Ipv4Address
        address:
          type: string
          format: ipv4
          maxLength: 15
          description: An IPv4 address.
          example: "84.125.93.10"
    Ipv6Address:
      type: object
      description: An IPv6 address.
      required:
        - addressType
        - address
      properties:
        addressType:
          type: string
          description: The address type discriminator.
          enum:
            - Ipv6Address
        address:
          type: string
          format: ipv6
          maxLength: 45
          description: An IPv6 address.
          example: "2001:db8:85a3::8a2e:370:7334"
    IpAddress:
      description: An IP address (IPv4 or IPv6).
      oneOf:
        - $ref: '#/components/schemas/Ipv4Address'
        - $ref: '#/components/schemas/Ipv6Address'
      discriminator:
        propertyName: addressType
        mapping:
          Ipv4Address: '#/components/schemas/Ipv4Address'
          Ipv6Address: '#/components/schemas/Ipv6Address'
    Endpoint:
      type: object
      description: An edge endpoint of a connection (customer or provider side).
      required:
        - type
        - primaryIpAddress
      properties:
        type:
          type: string
          description: The kind of touchpoint this endpoint represents.
          enum:
            - site
            - cloud
        name:
          type: string
          maxLength: 100
          description: A human-readable label for the endpoint.
          example: "London HQ"
        address:
          type: string
          maxLength: 255
          description: The postal/site address of the physical premises of the endpoint.
          example: "1 Braham Street, London, E1 8EE, United Kingdom"
        geo:
          $ref: '#/components/schemas/GeoLocation'
        primaryIpAddress:
          $ref: '#/components/schemas/IpAddress'
        secondaryIpAddress:
          $ref: '#/components/schemas/IpAddress'
    GeoLocation:
      type: object
      description: A geographic location expressed as latitude and longitude.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in decimal degrees.
          example: 51.5142
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in decimal degrees.
          example: -0.0708
    ConnectionCreate:
      type: object
      description: The customer and provider edges that define a connection to be created.
      required:
        - customerEdge
        - providerEdge
      properties:
        customerEdge:
          $ref: '#/components/schemas/Endpoint'
        providerEdge:
          $ref: '#/components/schemas/Endpoint'
    Connection:
      type: object
      description: A connection between a customer edge and a provider edge.
      required:
        - connectionId
        - customerEdge
        - providerEdge
      properties:
        connectionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
            - description: Unique identifier of the connection (assigned by the API provider).
              readOnly: true
        customerEdge:
          $ref: '#/components/schemas/Endpoint'
        providerEdge:
          $ref: '#/components/schemas/Endpoint'
    NetworkStatus:
      type: string
      description: The lifecycle status of a MultiPoint VPN network.
      enum:
        - PROVISIONING
        - ACTIVE
        - TERMINATING
        - TERMINATED
    FeasibilityRequest:
      type: object
      description: A request to qualify the feasibility of a MultiPoint VPN.
      required:
        - connections
        - guaranteedBandwidth
      properties:
        isProtected:
          type: boolean
          description: Whether the MultiPoint VPN requires protected (resilient) connectivity.
        connections:
          type: array
          maxItems: 100
          description: The list of connections (customer and provider edges) to be qualified.
          items:
            $ref: '#/components/schemas/ConnectionCreate'
        guaranteedBandwidth:
          $ref: '#/components/schemas/Bandwidth'
        servicePeriod:
          $ref: '#/components/schemas/TimePeriod'
    FeasibilityResult:
      type: object
      description: The result of a MultiPoint VPN feasibility qualification.
      required:
        - feasibilityStatus
      properties:
        feasibilityStatus:
          type: string
          description: Whether the requested MultiPoint VPN can be delivered.
          enum:
            - FEASIBLE
            - FEASIBLE_WITH_CONDITIONS
            - NOT_FEASIBLE
        estimatedActivationDate:
          type: string
          format: date-time
          maxLength: 30
          description: >
            The estimated date and time at which the network could be activated if
            ordered now. It must follow
            [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            and must have time zone.
          example: "2026-07-23T00:00:00Z"
        contextCode:
          type: string
          maxLength: 100
          description: Optional machine-readable code providing additional business context to the result.
          example: MULTI_POINT_VPN.CLOUD_ONRAMP_LEAD_TIME
        contextMessage:
          type: string
          maxLength: 255
          description: Optional human-readable explanation providing additional business context to the result.
          example: "Feasible; the cloud on-ramp requires additional provisioning lead time."
    NetworkCreate:
      type: object
      description: The attributes required to order a MultiPoint VPN network.
      required:
        - name
        - connections
        - guaranteedBandwidth
      properties:
        name:
          type: string
          maxLength: 100
          description: A consumer-defined name for the MultiPoint VPN network.
          example: "acme-emea-mesh"
        isProtected:
          type: boolean
          description: Whether the MultiPoint VPN requires protected (resilient) connectivity.
        connections:
          type: array
          maxItems: 100
          description: The list of connections (customer and provider edges) of the network.
          items:
            $ref: '#/components/schemas/ConnectionCreate'
        guaranteedBandwidth:
          $ref: '#/components/schemas/Bandwidth'
        qosProfile:
          type: string
          maxLength: 100
          description: >
            The name of the quality-of-service profile to apply to the network.
            The set of available profiles is defined by the API provider.
          example: "premium"
        servicePeriod:
          $ref: '#/components/schemas/TimePeriod'
    NetworkUpdate:
      type: object
      description: The service-level attributes of a MultiPoint VPN network that can be modified.
      properties:
        guaranteedBandwidth:
          $ref: '#/components/schemas/Bandwidth'
        qosProfile:
          type: string
          maxLength: 100
          description: The name of the quality-of-service profile to apply to the network.
          example: "premium"
    Network:
      type: object
      description: A MultiPoint VPN network resource.
      required:
        - networkId
        - name
        - status
        - connections
        - guaranteedBandwidth
      properties:
        networkId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
            - description: Unique identifier of the network (assigned by the API provider).
              readOnly: true
        name:
          type: string
          maxLength: 100
          description: The consumer-defined name of the MultiPoint VPN network.
          example: "acme-emea-mesh"
        status:
          $ref: '#/components/schemas/NetworkStatus'
        isProtected:
          type: boolean
          description: Whether the MultiPoint VPN provides protected (resilient) connectivity.
        connections:
          type: array
          maxItems: 100
          description: The list of connections that make up the network.
          items:
            $ref: '#/components/schemas/Connection'
        guaranteedBandwidth:
          $ref: '#/components/schemas/Bandwidth'
        qosProfile:
          type: string
          maxLength: 100
          description: The quality-of-service profile applied to the network.
          example: "premium"
        servicePeriod:
          $ref: '#/components/schemas/TimePeriod'
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          readOnly: true
          description: >
            The date and time the network was created. It must follow
            [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            and must have time zone.
          example: "2026-07-19T10:15:00Z"
    ErrorInfo:
      type: object
      description: Common schema for errors.
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code returned along with this error response.
        code:
          type: string
          maxLength: 100
          description: Code given to this error.
        message:
          type: string
          maxLength: 255
          description: Detailed error description.
  examples:
    multiPointVpnFeasibilityRequest:
      summary: Feasibility check for a two-touchpoint VPN
      description: Qualify a site-to-cloud MultiPoint VPN with a 6-month service period.
      value:
        isProtected: true
        connections:
          - customerEdge:
              type: site
              name: "London HQ"
              address: "1 Braham Street, London, E1 8EE, United Kingdom"
              primaryIpAddress:
                addressType: Ipv4Address
                address: "84.125.93.10"
              secondaryIpAddress:
                addressType: Ipv4Address
                address: "84.125.94.10"
            providerEdge:
              type: cloud
              name: "AWS eu-west-2"
              primaryIpAddress:
                addressType: Ipv4Address
                address: "10.0.0.1"
        guaranteedBandwidth:
          value: 20
